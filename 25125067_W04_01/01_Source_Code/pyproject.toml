[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "exam-baseline"
dynamic = ["version"]
description = "A measurable, single-generation-agent exam backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
  "pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]

[project.scripts]
exam-baseline = "exam_baseline.cli:main"
exam-pipeline = "exam_baseline.pipeline_cli:main"

[tool.setuptools.dynamic]
version = {attr = "exam_baseline.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exam_baseline = ["prompts/*.txt", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
